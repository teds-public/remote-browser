[package]
name = "remote-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "remote-browser"
path = "src/main.rs"

[[example]]
name = "monitor"
path = "examples/monitor.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
socketioxide = { version = "0.18", features = ["extensions"] }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
url = "2.5"
parking_lot = "0.12"
once_cell = "1.20"
subtle = "2.6"
thiserror = "2.0"
envy = "0.4"
rand = "0.8"
bytes = "1.9"
tokio-util = "0.7"
futures = "0.3"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
