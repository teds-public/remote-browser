<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Remote Browser</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --card: #1f2430;
    --border: #2a3040;
    --text: #e8eaf0;
    --muted: #9aa1b5;
    --accent: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  #nameOverlay, #urlOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 30; }
  #nameOverlay.hidden, #urlOverlay.hidden { display: none; }
  .modal { background: var(--panel); padding: 24px; border-radius: 16px; border: 1px solid var(--border); width: min(90vw, 360px); }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .modal input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: var(--text); margin-bottom: 12px; }
  .modal .row { display: flex; gap: 8px; }
  .modal .row button { flex: 1; padding: 12px; font-size: 15px; border-radius: 10px; border: 0; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: var(--card); color: var(--text); }
  header { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border); align-items: center; }
  #appTitle { font-weight: 700; font-size: 16px; }
  #view { position: relative; }
  button.bar { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button.bar.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  select.bar { padding: 10px 8px; font-size: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); max-width: 96px; }
  #layout { display: flex; flex: 1; min-height: 0; }
  #sidebar { width: 248px; background: var(--panel); border-right: 1px solid var(--border); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #sidebar.hide { display: none; }
  .tab { padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid transparent; font-size: 14px; cursor: pointer; }
  .tab.active { border-color: var(--accent); }
  .tab .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .tab .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .row { display: flex; align-items: center; }
  .tab .row .title { flex: 1; min-width: 0; }
  .tab .x { margin-left: 8px; color: var(--danger); padding: 4px 8px; border-radius: 8px; background: rgba(239,68,68,.12); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #view { background: #000; display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; position: relative; touch-action: none; }
  #view.hidden { display: none; }
  #view img { width: 100%; height: 100%; object-fit: contain; background: #000; pointer-events: none; }
  #view .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); font-size: 18px; pointer-events: none; }
  #view .loading.hidden { display: none; }
  #empty { flex: 1; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--muted); }
  #empty.show { display: flex; }
  #empty button { padding: 12px 24px; font-size: 15px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; }
  #streamBadge { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: none; border: 0; }
  #streamBadge.show { display: block; }
  .clickdot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid #f44; border-radius: 50%; pointer-events: none; animation: fadeout 1.2s forwards; }
  @keyframes fadeout { to { opacity: 0; transform: scale(2); } }
  #meta { padding: 6px 12px; font-size: 13px; color: var(--muted); }
  #stats { padding: 0 12px 10px; font-size: 12px; color: var(--muted); opacity: .7; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 10px 18px; border-radius: 10px; display: none; max-width: 90vw; z-index: 40; }
  @media (max-width: 700px) {
    #sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 15; width: min(80vw, 280px); transform: translateX(-100%); transition: transform .2s; }
    #sidebar.open { transform: none; }
    #sidebar.hide { display: flex; }
  }
</style>
</head>
<body>
<div id="nameOverlay">
  <div class="modal">
    <h2>Your name</h2>
    <p>This name is shown to others viewing the same tabs.</p>
    <input id="nameInput" maxlength="20" placeholder="e.g. Phone 1" />
    <div class="row"><button class="primary" id="nameBtn">Join</button></div>
  </div>
</div>
<div id="urlOverlay" class="hidden">
  <div class="modal">
    <h2>New tab</h2>
    <p>Paste a link to open. Leave empty for a blank tab.</p>
    <input id="newUrlInput" placeholder="https://example.com" inputmode="url" />
    <div class="row">
      <button class="ghost" id="urlCancelBtn">Cancel</button>
      <button class="primary" id="urlOpenBtn">Open</button>
    </div>
  </div>
</div>
<header>
  <button class="bar" id="menuBtn">&#9776;</button>
  <span id="appTitle">Remote Browser</span>
  <span style="flex:1"></span>
  <select class="bar" id="qualitySel" title="Stream resolution">
    <option value="low">480p</option>
    <option value="med" selected>720p</option>
    <option value="high">1080p</option>
  </select>
  <button class="bar" id="pauseBtn" title="Pause stream">Pause</button>
  <button class="bar" id="reloadBtn" title="Reload">&#10227;</button>
  <button class="bar" id="newTabBtn" title="New tab">+ New tab</button>
</header>
<div id="layout">
  <aside id="sidebar"></aside>
  <main>
    <div id="view">
      <img id="shot" alt="No image yet" />
      <div id="loading" class="loading hidden">Loading...</div>
      <button id="streamBadge">Stream lost — tap to retry</button>
    </div>
    <div id="empty">
      <div>No open tabs</div>
      <button id="emptyNewBtn">+ New tab</button>
    </div>
    <div id="meta"></div>
    <div id="stats"></div>
  </main>
</div>
<div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
